# ----------------------------------------------------------------------------
# companies.yaml — companies to check directly via their ATS job board API.
#
# IMPORTANT: these slugs are best-effort guesses (I have no live network
# access to verify them). Wrong/renamed slugs just return zero jobs for that
# company — harmless, doesn't break the run. Check data/skipped_companies.txt
# after a run to see which ones didn't resolve, and fix or remove them.
#
# provider must be one of: greenhouse, lever, ashby, smartrecruiters
#
# To add a company yourself:
#   Greenhouse — visit boards.greenhouse.io/<slug>, the slug is in the URL
#   Lever      — visit jobs.lever.co/<slug>
#   Ashby      — visit jobs.ashbyhq.com/<slug>
#   SmartRecruiters — visit careers.smartrecruiters.com/<slug>
# ----------------------------------------------------------------------------

