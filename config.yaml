# ----------------------------------------------------------------------------
# config.yaml — non-secret settings. Secrets (API keys, email password) live
# in GitHub Actions "Secrets", never in this file.
# ----------------------------------------------------------------------------

# What roles to search for — more variants = wider Adzuna coverage
search_keywords:
  - "Data Engineer"
  - "Data Engineering"
  - "Big Data Engineer"
  - "Azure Data Engineer"
  - "PySpark Developer"
  - "ETL Developer"
  - "Analytics Engineer"

# Where to search. Adzuna uses ISO country codes: in, us, gb, ca, au, etc.
locations:
  - country: "in"
    city: "Bangalore"
  - country: "in"
    city: "Hyderabad"
  - country: "in"
    city: "Remote"

# How many results to pull per (keyword, location) pair. Adzuna free tier
# allows generous daily calls; keep this modest to stay well within limits.
results_per_search: 30

# ----------------------------------------------------------------------------
# Skills based on Ashok's actual resume (Sr. Data Engineer, ~5 yrs exp).
# These drive job filtering AND the "Changes Needed" comparison.
#
# - Skills already on the resume: matching jobs that need them won't show
#   them as "missing" — resume already covers these.
# - Skills NOT yet on the resume (marked below) will show up in "Changes
#   Needed" whenever a matched job asks for them — these are learning
#   targets Ashok wants to track and add to his resume once acquired.
# ----------------------------------------------------------------------------
required_skills:
  # --- already on resume ---
  - "PySpark"
  - "Spark"
  - "SQL"
  - "Python"
  - "Hive"
  - "AWS Lambda"
  - "AWS Step Functions"
  - "AWS S3"
  - "CloudWatch"
  - "Redshift"
  - "IAM"
  - "PostgreSQL"
  - "Informatica"
  - "Hadoop"
  - "Cloudera"
  # --- NOT on resume yet — will surface in "Changes Needed" ---
  - "Azure"
  - "Azure Databricks"
  - "Azure Data Factory"
  - "Databricks"
  - "Snowflake"
  - "Airflow"
  - "Kafka"
  - "AWS Glue"

# Skills that MUST be present in the job description for it to count as a
# match at all — a hard gate applied before match_mode below. Kept as
# PySpark + SQL since both are core to Ashok's actual experience.
core_skills:
  - "PySpark"
  - "SQL"

# "any"  -> keep job if it mentions AT LEAST ONE required skill (besides core_skills)
# "all"  -> keep job if it mentions EVERY required skill (strict, few results)
# "min_count" -> keep job if it mentions at least `min_skill_matches` skills
match_mode: "min_count"
min_skill_matches: 3

# Jobs whose description mentions an experience range overlapping this
# window get copied into a second sheet, "3-6 Years Experience", in the
# same Excel file. This is a best-effort text match — not every posting
# states experience explicitly, so some relevant jobs may not appear here
# even if they'd suit you; the main sheet always has everything.
experience_filter:
  min_years: 3
  max_years: 6

# Your daily application target. Purely informational — if fewer than this
# many NEW jobs are found on a given day, the email says so, so you know to
# widen required_skills/match_mode or add more companies. It cannot force
# more real job postings to exist.
min_daily_new_jobs: 10

# Excel output filename (a dated copy is also kept for history)
output_filename: "Data_Engineering_Jobs.xlsx"

# Path to your resume (checked into the repo — see README for privacy notes)
resume_path: "resume/resume.pdf"
